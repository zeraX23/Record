<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Online - Video Conference</title>
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        #setup-container {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%;
        }
        h2 { color: #1a73e8; margin-top: 0; }
        p { color: #555; margin-bottom: 20px; font-size: 14px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        .input-group input { 
            width: 100%; padding: 12px; border: 1px solid #ccc; 
            border-radius: 8px; font-size: 14px; transition: border 0.3s;
        }
        .input-group input:focus { border-color: #1a73e8; outline: none; }
        
        button {
            width: 100%; padding: 12px; background-color: #1a73e8; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        button:hover { background-color: #1557b0; }
        
        /* Container untuk video conference (awalnya disembunyikan) */
        #meeting-container { display: none; width: 100%; height: 100vh; background: #000; }
        
        /* Tombol keluar (muncul saat meeting berlangsung) */
        #leaveBtn {
            position: fixed; top: 15px; right: 15px; width: auto; 
            background-color: #dc3545; padding: 8px 16px; z-index: 100; display: none;
        }
        #leaveBtn:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <div id="setup-container">
        <h2>🌐 Meeting Online</h2>
        <p>Buat atau gabung ke ruangan meeting tanpa batas waktu.</p>
        
        <div class="input-group">
            <label for="roomName">Nama Ruangan</label>
            <input type="text" id="roomName" placeholder="Misal: RapatProyek123" required>
        </div>
        
        <div class="input-group">
            <label for="userName">Nama Anda</label>
            <input type="text" id="userName" placeholder="Misal: Hufron" required>
        </div>
        
        <button onclick="startMeeting()">Masuk ke Ruangan</button>
    </div>

    <div id="meeting-container"></div>
    <button id="leaveBtn" onclick="leaveMeeting()">Keluar Meeting</button>

    <script>
        let api = null; // Menyimpan objek API Jitsi

        function startMeeting() {
            const roomNameInput = document.getElementById('roomName').value.trim();
            const userNameInput = document.getElementById('userName').value.trim();

            if (!roomNameInput || !userNameInput) {
                alert("Harap isi Nama Ruangan dan Nama Anda!");
                return;
            }

            // Menyembunyikan tampilan lobi, memunculkan layar meeting
            document.getElementById('setup-container').style.display = 'none';
            document.getElementById('meeting-container').style.display = 'block';
            document.getElementById('leaveBtn').style.display = 'block';

            // Konfigurasi Jitsi Meet
            const domain = 'meet.jit.si';
            const options = {
                roomName: roomNameInput.replace(/\s+/g, '-'), // Mengganti spasi dengan strip
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#meeting-container'),
                userInfo: {
                    displayName: userNameInput
                },
                configOverwrite: {
                    startWithAudioMuted: true, // Masuk dalam keadaan mic mati
                    startWithVideoMuted: false, // Masuk dalam keadaan kamera hidup
                    prejoinPageEnabled: false // Langsung masuk tanpa halaman pre-join jitsi
                },
                interfaceConfigOverwrite: {
                    SHOW_JITSI_WATERMARK: false // Menyembunyikan logo jitsi
                }
            };

            // Memulai Meeting
            api = new JitsiMeetExternalAPI(domain, options);
            
            // Event listener saat user secara internal menekan tombol hangup di Jitsi
            api.addListener('videoConferenceLeft', () => {
                leaveMeeting();
            });
        }

        function leaveMeeting() {
            if (api) {
                api.dispose(); // Mematikan iframe video
                api = null;
            }
            
            // Mengembalikan tampilan ke lobi awal
            document.getElementById('setup-container').style.display = 'block';
            document.getElementById('meeting-container').style.display = 'none';
            document.getElementById('leaveBtn').style.display = 'none';
            
            // Kosongkan nama ruangan untuk meeting selanjutnya
            document.getElementById('roomName').value = '';
        }
    </script>
</body>
</html>
